name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER"
          
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Unable to detect active Java version."
            exit 1
          fi
          
          JAVA_MAJOR=$(echo "$JAVA_VER" | cut -d'.' -f1)
          if [ "$JAVA_MAJOR" = "1" ]; then
            JAVA_MAJOR=$(echo "$JAVA_VER" | cut -d'.' -f2)
          fi
          
          echo "Detected Java major version: $JAVA_MAJOR"
          
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          
          echo "Java version verification passed (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Temporary Debug Keystore Check ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore is ready."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          echo "=== APK Verification ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at: $EXPECTED_APK"
            echo "Searching inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK file exists but is empty: $EXPECTED_APK"
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension: $EXPECTED_APK"; exit 1 ;;
          esac
          
          echo "Successfully verified debug APK: $EXPECTED_APK"
          ls -la "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing Release Asset ==="
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$APK_SOURCE" ] || [ ! -s "$APK_SOURCE" ]; then
            echo "ERROR: Source APK missing or empty: $APK_SOURCE"
            exit 1
          fi

          TEMP_ASSET_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "$TEMP_ASSET_DIR"
          
          REPO_RAW="${{ github.repository }}"
          REPO_NAME="${REPO_RAW##*/}"
          REPO_SANITIZED=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g' | sed 's/^-*//;s/-*$//')
          if [ -z "$REPO_SANITIZED" ]; then
            REPO_SANITIZED="android-app"
          fi
          
          RELEASE_ASSET_NAME="${REPO_SANITIZED}-debug-build-${{ github.run_number }}.apk"
          RELEASE_ASSET_PATH="${TEMP_ASSET_DIR}/${RELEASE_ASSET_NAME}"
          
          cp "$APK_SOURCE" "$RELEASE_ASSET_PATH"
          
          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at: $RELEASE_ASSET_PATH"
            exit 1
          fi
          
          echo "Prepared release asset: $RELEASE_ASSET_NAME"
          echo "Asset path: $RELEASE_ASSET_PATH"
          echo "asset_path=${RELEASE_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty at '$ASSET_PATH'."
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "ERROR: Asset is not an APK: $ASSET_PATH"; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES=$(cat <<EOF
          ### Automated Debug Build
          
          - **Build Run Number:** #${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** \`${{ github.sha }}\`
          
          > **Note:** This is an automatically generated debug APK built by GitHub Actions.
          > This APK is intended for testing purposes only and is not a Google Play Store production release.
          > The APK is signed with a temporary Android debug keystore.
          EOF
          )
          
          echo "Creating release with tag: $RELEASE_TAG and title: $RELEASE_TITLE"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Download Result Summary ==="
          RELEASE_STATUS="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "GitHub Release publishing SUCCEEDED."
            
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            
            echo "## 📱 Debug APK Build & Release Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **Debug APK built successfully and published to GitHub Releases!**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release:** [$RELEASE_TITLE]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Filename:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 📥 How to Download" >> "$GITHUB_STEP_SUMMARY"
            echo "1. Visit the [GitHub Release Page]($RELEASE_URL)." >> "$GITHUB_STEP_SUMMARY"
            echo "2. Under the **Assets** section, download **\`$ASSET_NAME\`** directly to your Android device or computer." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ℹ️ **Backup:** The standard workflow artifact (\`app-debug-apk\`) is also available under the Actions run artifacts." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not complete successfully or was skipped."
            echo "The debug APK was built successfully and is preserved as an Actions artifact."
            echo "Artifact name: app-debug-apk"
            
            echo "## 📱 Debug APK Build Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **Debug APK built and saved as Actions Artifact!**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ *Note:* GitHub Release publishing was not completed, but your debug APK is safely preserved as a workflow artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 📥 How to Download" >> "$GITHUB_STEP_SUMMARY"
            echo "You can download the APK from the **Artifacts** section of this GitHub Actions run named **\`app-debug-apk\`**." >> "$GITHUB_STEP_SUMMARY"
          fi
